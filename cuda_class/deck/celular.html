<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>Controle da aula</title>
  <style>
    :root {
      --background: #111111;
      --panel: #1e1e1e;
      --ink: #f2f2f2;
      --muted: #a0a0a0;
      --accent: #4c8ee6;
      --warning: #e08a2e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--background); color: var(--ink); }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      gap: 10px;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    header { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
    #position { font-size: 18px; color: var(--muted); }
    #timer { font-size: 30px; font-weight: 700; background: none; border: none; color: var(--ink); padding: 0; }
    #timer.stopped { color: var(--muted); }
    #title { font-size: 22px; font-weight: 700; line-height: 1.25; }
    #steps { font-size: 15px; color: var(--accent); min-height: 18px; }
    #next { font-size: 15px; color: var(--muted); }
    #notes {
      flex: 1 1 auto;
      overflow-y: auto;
      background: var(--panel);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 19px;
      line-height: 1.4;
      -webkit-user-select: text;
      user-select: text;
    }
    #notes:empty::before { content: "sem notas neste slide"; color: var(--muted); }
    #connection { font-size: 14px; color: var(--warning); min-height: 16px; }
    nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
    nav button {
      font-size: 26px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      padding: 0;
      height: 22vh;
      min-height: 110px;
      color: var(--ink);
      background: var(--panel);
    }
    nav button:active { filter: brightness(1.4); }
    #forward { background: var(--accent); }
    footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    footer button {
      font-size: 16px;
      border: none;
      border-radius: 10px;
      height: 48px;
      color: var(--ink);
      background: var(--panel);
    }
    footer button.on { background: var(--warning); color: #111111; }
  </style>
</head>
<body>
  <header>
    <span id="position">–</span>
    <button id="timer" class="stopped">00:00</button>
  </header>
  <div id="title">conectando…</div>
  <div id="steps"></div>
  <div id="next"></div>
  <div id="notes"></div>
  <div id="connection"></div>
  <nav>
    <button id="back">◀</button>
    <button id="forward">▶</button>
  </nav>
  <footer>
    <button id="black">tela preta</button>
    <button id="first">início</button>
  </footer>

<script>
  const STATE_POLL_MS = 400;
  const CLASS_MINUTES = 120;
  let classStart = null;

  function send(command) {
    if (command === 'next' && classStart === null) classStart = Date.now();
    if (navigator.vibrate) navigator.vibrate(15);
    fetch('/comando', { method: 'POST', body: command }).catch(showDisconnected);
  }

  function twoDigits(number) {
    return String(number).padStart(2, '0');
  }

  function showTimer() {
    const timer = document.getElementById('timer');
    timer.classList.toggle('stopped', classStart === null);
    if (classStart === null) return;
    const seconds = Math.floor((Date.now() - classStart) / 1000);
    const minutes = Math.floor(seconds / 60);
    timer.textContent = `${twoDigits(minutes)}:${twoDigits(seconds % 60)} / ${CLASS_MINUTES}`;
  }

  function resetTimer() {
    classStart = classStart === null ? Date.now() : null;
    document.getElementById('timer').textContent = '00:00';
    showTimer();
  }

  function stepsText(stepsLeft) {
    if (!stepsLeft) return '';
    return 'ainda há passos neste slide';
  }

  function showState(state) {
    if (!state.total) {
      document.getElementById('title').textContent = 'abra a aula no navegador do laptop';
      return;
    }
    document.getElementById('position').textContent = `slide ${state.number} de ${state.total}`;
    document.getElementById('title').textContent = state.title || '(sem título)';
    document.getElementById('steps').textContent = stepsText(state.stepsLeftHere);
    document.getElementById('next').textContent = state.next ? `depois: ${state.next}` : 'último slide';
    const notes = document.getElementById('notes');
    if (notes.innerHTML !== state.notes) notes.innerHTML = state.notes;
    document.getElementById('black').classList.toggle('on', state.paused);
  }

  function showDisconnected() {
    document.getElementById('connection').textContent = 'sem conexão com o laptop';
  }

  async function followTheDeck() {
    try {
      const state = await (await fetch('/estado')).json();
      document.getElementById('connection').textContent = '';
      showState(state);
    } catch (error) {
      showDisconnected();
    }
  }

  document.getElementById('forward').addEventListener('click', () => send('next'));
  document.getElementById('back').addEventListener('click', () => send('prev'));
  document.getElementById('black').addEventListener('click', () => send('black'));
  document.getElementById('first').addEventListener('click', () => send('first'));
  document.getElementById('timer').addEventListener('click', resetTimer);
  setInterval(followTheDeck, STATE_POLL_MS);
  setInterval(showTimer, 1000);
  followTheDeck();
</script>
</body>
</html>
